<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYOTA KATADA / THINGS</title>
    <meta name="description" content="Things I like — gear and objects I actually use, picked by Ryota Katada.">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
    <link rel="canonical" href="https://esp-9.dev/things">

    <!-- OGP -->
    <meta property="og:title" content="RYOTA KATADA / THINGS">
    <meta property="og:description" content="Things I like — gear and objects I actually use.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://esp-9.dev/things">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@e___sp9">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./things.css">

</head>

<body class="things-page">
    <!-- Apply saved theme before first paint to avoid a light flash -->
    <script>
        try {
            if (localStorage.getItem('portfolio-theme') === 'dark') document.body.classList.add('dark-mode');
        } catch (_) { }
    </script>
    <!-- CRT Effects -->
    <div id="scanlines"></div>
    <div id="dither"></div>

    <!-- Header -->
    <div id="exp-header">
        <div class="exp-left">
            <a class="exp-label" href="/">RYOTA KATADA</a>
            <span class="exp-sep">/</span>
            <span class="exp-type">THINGS</span>
        </div>
        <div class="exp-right">
            <button id="theme-toggle" class="exp-btn" aria-label="Toggle dark/light mode">DARK</button>
            <a id="home-btn" class="exp-btn" href="/">&#x2190; HOME</a>
            <a id="blog-btn" class="exp-btn" href="https://www.kissa-katada.com" target="_blank">BLOG &#x2197;</a>
        </div>
    </div>

    <!-- Virtual Screen -->
    <main id="things-screen">
        <div class="things-head">
            <div class="ph"><span class="dot b"></span> THINGS</div>
            <div class="things-sub">
                <span class="things-tag">STUFF I LIKE</span>
                <span class="things-count" id="things-count">-- ITEMS</span>
            </div>
        </div>

        <div id="things-grid" class="things-grid"></div>
    </main>

    <!-- Footer -->
    <div id="exp-footer">
        <span class="ef-credit">Built with Bun</span>
        <span class="ef-copy">&copy; 2026 RYOTA KATADA</span>
    </div>

    <script type="module" src="./things-page.ts"></script>
</body>

</html>
