name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the microCMS webhook when a post is published, updated, unpublished or deleted (docs/DEPLOY.md)
  repository_dispatch:
    types: [microcms-content-changed]

# Never run two deploys at once; let a running deploy finish and queue the newest one
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Generates /blog from microCMS. Without the keys, or when the posts cannot be fetched,
      # the build fails and nothing is deployed, so the live /blog stays as it is
      - run: bun run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
